<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Pilih Kategori — Belajar Bahasa Inggris</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B5E58">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <div class="blob-decor">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="app-shell">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">🦉</div>
        <div class="brand-text">
          <strong>Belajar Kata</strong>
          <span>ENGLISH FOR KIDS</span>
        </div>
      </div>
      <div class="user-chip">
        <span id="namaPengguna">...</span>
        <button id="logoutBtn">Keluar</button>
      </div>
    </div>

    <div id="levelCard" class="level-card">
      <div class="skeleton-pill" style="height:88px;"></div>
    </div>

    <h2 class="section-title">Pilih Kelompok Kata</h2>
    <p class="section-sub">Tap salah satu kelompok untuk mulai belajar atau uji kemampuanmu.</p>

    <div id="statsBar" class="stats-bar">
      <div class="skeleton-pill"></div>
      <div class="skeleton-pill"></div>
    </div>

    <div id="tersulitCard" class="tersulit-card" style="display:none;"></div>

    <div class="search-filter-bar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Cari kelompok kata..." autocomplete="off">
      </div>
      <div class="filter-chips" id="filterChips">
        <button class="filter-chip aktif" data-level="semua">Semua</button>
        <button class="filter-chip" data-level="pemula">🌱 Pemula</button>
        <button class="filter-chip" data-level="menengah">🌿 Menengah</button>
        <button class="filter-chip" data-level="lanjutan">🌳 Lanjutan</button>
      </div>
    </div>

    <div id="categoryGrid" class="category-grid">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
    <div id="noResultState" class="empty-state" style="display:none;">
      Tidak ada kelompok kata yang cocok. Coba kata kunci lain.
    </div>
    <div id="emptyState" class="empty-state" style="display:none;">
      Belum ada kelompok kata. Tambahkan file kategori baru ke folder <strong>data/categories</strong> untuk mulai.
    </div>
  </div>

  <script src="js/shared.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="install.js"></script>
</body>
</html>
