<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Belajar Kata</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B5E58">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  /* Gaya khusus tombol Putar Otomatis — sengaja ditaruh di halaman ini
     (bukan di style.css) supaya tidak bentrok dengan file CSS kamu. */
  .autoplay-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    max-width: 320px;
    margin: 10px auto 0;
    padding: 12px 20px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(120deg, #0FA3A3, #0B5E58);
    color: #fff;
    font-family: inherit;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(11, 94, 88, 0.28);
    transition: transform .15s ease, box-shadow .15s ease, background .2s ease;
  }
  .autoplay-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(11, 94, 88, 0.32); }
  .autoplay-btn:active { transform: translateY(0); }
  .autoplay-btn.aktif {
    background: linear-gradient(120deg, #FF6B6B, #E8594B);
    box-shadow: 0 6px 16px rgba(232, 89, 75, 0.3);
  }
  .autoplay-btn.aktif .autoplay-dot {
    animation: autoplay-berdenyut 1s ease-in-out infinite;
  }
  @keyframes autoplay-berdenyut {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .5; transform: scale(0.8); }
  }

  /* Mode layar-tunggal (satu layar penuh, tanpa scroll): tombol Putar
     Otomatis ikut dikecilkan & tidak boleh mengecil (flex-shrink:0) supaya
     selalu ikut ketampung dan tidak ketutup/terpotong di bawah layar. */
  body.layar-tunggal .autoplay-btn {
    flex-shrink: 0;
    width: auto;
    max-width: min(280px, 80vw);
    margin: 0;
    padding: clamp(7px, 1.3vh, 10px) clamp(14px, 3vw, 18px);
    font-size: clamp(11px, 1.6vh, 12.5px);
    gap: 6px;
  }
</style>
</head>
<body class="layar-tunggal">
  <div class="blob-decor">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>
  <div class="app-shell">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">🦉</div>
        <div class="brand-text">
          <strong>Belajar Kata</strong>
          <span>ENGLISH FOR KIDS</span>
        </div>
      </div>
      <div class="user-chip">
        <span id="namaPengguna">...</span>
        <a href="dashboard.html" id="backBtn" class="btn-kembali">← Kembali</a>
      </div>
    </div>
    <div class="flash-header">
      <h2 id="judulKategori" class="section-title">Memuat...</h2>
    </div>
    <div class="flash-header" style="margin-top:-14px;">
      <span class="progress-label" id="progressLabel">1 / 10</span>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:10%"></div></div>
      <span class="mastery-badge" id="masteryBadge">⭐ 0/0</span>
      <a href="#" id="quizLink" class="btn-secondary" style="text-decoration:none; padding:9px 18px; font-size:13px;">Uji Aku →</a>
    </div>
    <div class="card-stage">
      <div class="flip-card" id="flipCard">
        <div class="flip-card-inner" id="flipCardInner">
          <div class="flip-face flip-front">
            <div class="flip-emoji" id="emojiFront">🎨</div>
            <div class="flip-word-id" id="kataIndo">...</div>
            <div class="flip-tap-hint">👆 Tap kartu untuk lihat jawaban</div>
          </div>
          <div class="flip-face flip-back">
            <div class="flip-emoji" id="emojiBack">🎨</div>
            <div class="flip-word-en" id="kataInggris">...</div>
            <div class="flip-tap-hint on-back">👆 Tap lagi untuk kembali</div>
          </div>
        </div>
      </div>
      <button class="speak-btn" id="speakBtn" title="Dengarkan pengucapan" aria-label="Dengarkan pengucapan">🔊</button>
      <div class="nav-row">
        <button class="nav-btn" id="prevBtn" aria-label="Kata sebelumnya">←</button>
        <button class="nav-btn" id="nextBtn" aria-label="Kata berikutnya">→</button>
      </div>
      <button class="btn-hafal" id="btnHafal">⭐ Tandai Sudah Hafal</button>
      <button class="autoplay-btn" id="autoplayBtn">
        <span class="autoplay-dot">▶️</span>
        <span id="autoplayLabel">Putar Otomatis</span>
      </button>
    </div>
  </div>
  <script src="js/shared.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/flashcard.js"></script>
  <script src="install.js"></script>
</body>
</html>
