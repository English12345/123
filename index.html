<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Belajar Bahasa Inggris Anak — Masuk</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B5E58">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  /* Kritis, ditaruh inline supaya splash langsung tampil sempurna
     SEBELUM css/style.css & font Google selesai didownload — jadi
     tidak ada jeda blank/putih di antara splash OS dan halaman ini. */
  #splashScreen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background:
      radial-gradient(circle at 20% 20%, rgba(111,220,209,.35), transparent 55%),
      radial-gradient(circle at 82% 78%, rgba(255,201,60,.28), transparent 50%),
      linear-gradient(160deg, #0B5E58 0%, #0A4A46 55%, #082F2D 100%);
    transition: opacity .45s ease, visibility .45s ease;
  }
  #splashScreen.splash-hide { opacity: 0; visibility: hidden; pointer-events: none; }

  .splash-badge {
    position: relative;
    width: 132px;
    height: 132px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 35% 30%, #6FDCD1, #0FA3A3 60%, #0B5E58 100%);
    box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 20px 50px rgba(0,0,0,.35), 0 0 46px rgba(255,201,60,.35);
    animation: splash-float 3.2s ease-in-out infinite;
  }
  .splash-badge::before {
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 2px solid rgba(255,201,60,.55);
    animation: splash-ring 2.4s ease-out infinite;
  }
  .splash-badge span { font-size: 62px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.3)); }

  .splash-title {
    font-family: 'Baloo 2', system-ui, sans-serif;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: .3px;
    margin: 0;
    background: linear-gradient(100deg, #FFE29A 0%, #FFFFFF 35%, #6FDCD1 60%, #FFE29A 100%);
    background-size: 220% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: splash-shimmer 3s linear infinite;
  }
  .splash-sub {
    margin: -14px 0 4px;
    font-family: 'Nunito', system-ui, sans-serif;
    font-size: 14px;
    color: rgba(255,255,255,.72);
    letter-spacing: .2px;
  }

  .splash-bar-track {
    width: 168px;
    height: 7px;
    border-radius: 99px;
    background: rgba(255,255,255,.14);
    overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.25);
  }
  .splash-bar-fill {
    height: 100%;
    width: 40%;
    border-radius: 99px;
    background: linear-gradient(90deg, #2EC4B6, #FFC93C);
    animation: splash-loading 1.15s ease-in-out infinite;
  }

  @keyframes splash-float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-10px) scale(1.03); }
  }
  @keyframes splash-ring {
    0% { transform: scale(.92); opacity: .9; }
    100% { transform: scale(1.35); opacity: 0; }
  }
  @keyframes splash-shimmer {
    0% { background-position: 0% center; }
    100% { background-position: 220% center; }
  }
  @keyframes splash-loading {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .splash-badge, .splash-badge::before, .splash-title, .splash-bar-fill { animation: none; }
  }

  /* PENTING: css/style.css bikin <body> mulai dari opacity:0 lalu di-fade ke 1
     lewat class "halaman-siap" (transisi antar halaman, lihat shared.js).
     Kalau splash dibiarkan jadi anak <body> apa adanya, splash ikut ketutup
     opacity:0 itu juga -- malah nambah kedip blank, bukan menghilangkannya.
     Jadi di sini <body> dipaksa selalu terlihat (opacity:1), dan fade-in
     "halaman-siap" itu dipindah supaya cuma berlaku ke #pageContent (konten
     login di bawah splash), bukan ke seluruh body. */
  body { opacity: 1 !important; }
  #pageContent { opacity: 0; transition: opacity .22s ease; }
  body.halaman-siap #pageContent { opacity: 1; }
  body.halaman-keluar #pageContent { opacity: 0; transition: opacity .16s ease; }
</style>
</head>
<body>
  <div id="splashScreen" aria-hidden="true">
    <div class="splash-badge"><span>🦉</span></div>
    <div>
      <h1 class="splash-title">Belajar Kata</h1>
      <p class="splash-sub">Menyiapkan kosakata...</p>
    </div>
    <div class="splash-bar-track"><div class="splash-bar-fill"></div></div>
  </div>
  <div id="pageContent">
    <div class="blob-decor">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>
    <div class="center-shell">
      <div class="login-card">
        <div class="login-mascot">🦉</div>
        <div class="update-banner" id="updateBanner" style="display:none;">
          🔄 Versi baru tersedia
          <button type="button" id="btnUpdate">Update</button>
        </div>
        <button type="button" class="btn-install" id="btnInstall" style="display:none;">
          📲 Install Aplikasi ke HP
        </button>
        <p class="ios-hint" id="iosInstallHint" style="display:none;"></p>

        <h1>Belajar Kata!</h1>
        <p class="sub">Yuk masuk untuk mulai belajar Bahasa Inggris</p>
        <div class="error-msg" id="errorMsg"></div>
        <form id="loginForm">
          <div class="field">
            <label for="username">Nama Pengguna</label>
            <input type="text" id="username" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Masukkan nama pengguna" required>
          </div>
          <div class="field">
            <label for="password">Kata Sandi</label>
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Masukkan kata sandi" required>
          </div>
          <button type="submit" class="btn-primary" id="submitBtn">Masuk & Mulai Belajar</button>
        </form>
      </div>
    </div>
  </div>
  <script src="js/config.js?v=2"></script>
  <script src="js/shared.js"></script>
  <script src="js/auth.js"></script>
  <script src="install.js"></script>
  <script>
    // Splash tampil MINIMAL 700ms (biar tidak kedip kalau HP-nya cepat),
    // dan ditutup setelah semua asset halaman (font, css, gambar) beres load.
    // Kalau user sudah login, auth.js redirect ke dashboard.html duluan
    // sebelum ini sempat jalan -- itu wajar dan tidak masalah.
    (function () {
      const splash = document.getElementById('splashScreen');
      if (!splash) return;
      const MIN_TAMPIL_MS = 700;
      const mulai = Date.now();
      function tutupSplash() {
        const sisaWaktu = Math.max(0, MIN_TAMPIL_MS - (Date.now() - mulai));
        setTimeout(() => splash.classList.add('splash-hide'), sisaWaktu);
      }
      if (document.readyState === 'complete') {
        tutupSplash();
      } else {
        window.addEventListener('load', tutupSplash);
        // Jaga-jaga kalau event 'load' lambat/tidak terpicu (mis. font server lambat) —
        // splash tetap harus hilang, jangan sampai user terjebak di layar loading.
        setTimeout(tutupSplash, 3500);
      }
    })();
  </script>
</body>
</html>
